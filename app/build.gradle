plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.appdistribution'
    id 'kotlin-kapt'
}

android {
    namespace 'com.mtg.tool.findmyphone'
    compileSdk 34

    defaultConfig {
        applicationId "com.yugi.fmf"
        minSdk 24
        targetSdk 34
        versionCode 111
        versionName "1.1.1"

        def formattedDate = new Date().format('MMM.dd.yyyy.hh.mm.ss')
        archivesBaseName = "${namespace}_V${versionName}_${formattedDate}"


        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    bundle {
        language {

            enableSplit = false
        }
    }


    signingConfigs {
        release {
            storeFile file('key/release.jks')
            storePassword 'com.mtg.find.phone.clap.phonefinder.findmyphone'
            keyAlias 'release'
            keyPassword 'com.mtg.find.phone.clap.phonefinder.findmyphone'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            firebaseAppDistribution {
                testers="drotest01@gmail.com"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        compose true
    }

    flavorDimensions "dimen"
    productFlavors {
        vOfficial_ {
            applicationId "com.yugi.fmf"

            buildConfigField "boolean", "TEST_AD", "false"
            buildConfigField "boolean", "PURCHASED", "false"
            dimension "dimen"

            def addConstantTo = { target, constantName, constantValue ->
                target.manifestPlaceholders += [(constantName): constantValue]
                target.buildConfigField "String", "${constantName}", "\"${constantValue}\""

            }

            addConstantTo(owner, "APP_ID", "ca-app-pub-3940256099942544~3347511713")
//            -----------------------------------------------------------------------------------
            addConstantTo(owner, "app_reopen", "ca-app-pub-3940256099942544/9257395921")
            addConstantTo(owner, "banner_splash_high", "ca-app-pub-3940256099942544/6300978111")
            addConstantTo(owner, "banner_splash", "ca-app-pub-3940256099942544/6300978111")
            addConstantTo(owner, "inter_splash_high", "ca-app-pub-3940256099942544/1033173712")
            addConstantTo(owner, "inter_splash", "ca-app-pub-3940256099942544/1033173712")
            addConstantTo(owner, "lfo1_native_high", "ca-app-pub-3940256099942544/2247696110")
