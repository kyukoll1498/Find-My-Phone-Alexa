plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-kapt'
}

android {
    namespace 'com.mtg.tool.findmyphone'
    compileSdk 34

    defaultConfig {
        applicationId "com.mtg.tool.findmyphone"
        minSdk 24
        targetSdk 34
        versionCode 116
        versionName "1.1.6"

        def formattedDate = new Date().format('MMM.dd.yyyy.hh.mm.ss')
        archivesBaseName = "${namespace}_V${versionName}_${formattedDate}"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('key/release.jks')
            storePassword 'com.mtg.find.phone.clap.phonefinder.findmyphone'
            keyAlias 'release'
            keyPassword 'com.mtg.find.phone.clap.phonefinder.findmyphone'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures{
        viewBinding = true
        dataBinding = true
    }

    flavorDimensions "dimen"
    productFlavors{
        vOfficial_ {
            applicationId "com.example.develop.findmyphone"

            buildConfigField "boolean", "TEST_AD", "false"
            buildConfigField "boolean", "PURCHASED", "false"
            dimension "dimen"

            def addConstantTo = { target, constantName, constantValue ->
                target.manifestPlaceholders += [(constantName): constantValue]
                target.buildConfigField "String", "${constantName}", "\"${constantValue}\""
            }

            addConstantTo(owner, "APP_ID", "ca-app-pub-3940256099942544~3347511713")
            addConstantTo(owner, "open_app", "ca-app-pub-3940256099942544/3419835294")
            addConstantTo(owner, "inter_splash", "ca-app-pub-3940256099942544/1033173712")

            addConstantTo(owner, "native_guide", "ca-app-pub-3940256099942544/2247696110")
            addConstantTo(owner, "native_language", "ca-app-pub-3940256099942544/2247696110")
            addConstantTo(owner, "native_sound", "ca-app-pub-3940256099942544/2247696110")
            addConstantTo(owner, "inter_sound", "ca-app-pub-3940256099942544/1033173712")

            addConstantTo(owner, "collapsible_banner_home", "ca-app-pub-3940256099942544/2014213617")
            addConstantTo(owner, "collapsible_banner_detail_sound", "ca-app-pub-3940256099942544/2014213617")
            addConstantTo(owner, "collapsible_banner_how_to_use", "ca-app-pub-3940256099942544/2014213617")

            addConstantTo(owner, "banner_language", "ca-app-pub-3940256099942544/6300978111")

            addConstantTo(owner, "native_create", "ca-app-pub-3940256099942544/2247696110")
            addConstantTo(owner, "native_record", "ca-app-pub-3940256099942544/2247696110")

            addConstantTo(owner, "native_permission", "ca-app-pub-3940256099942544/2247696110")

        }
    }

    lintOptions {
        disable 'ContentDescription'
        disable 'SpUsage'
        disable 'UselessParent'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.google.android.play:review-ktx:2.0.1'
    implementation 'com.google.android.gms:play-services-ads:21.2.0'
    implementation(platform("com.google.firebase:firebase-bom:32.2.0"))
    implementation("com.google.firebase:firebase-analytics-ktx")
    implementation("com.google.firebase:firebase-crashlytics-ktx")
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    implementation "com.google.code.gson:gson:2.9.0"
    implementation platform('com.google.firebase:firebase-bom:30.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-database'
    implementation project(path: ':MTGLibs')
    implementation project(path: ':custom_seekbar')

    implementation('com.akexorcist:localization:1.2.10') {
        exclude group: 'androidx.core', module: 'core'
    }

    implementation "io.reactivex.rxjava3:rxjava:3.0.12"
    implementation "io.reactivex.rxjava3:rxandroid:3.0.0"

    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation "com.github.skydoves:powermenu:2.2.0"
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.airbnb.android:lottie:5.2.0'

    //permission
    implementation 'com.karumi:dexter:6.2.3'

    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.github.yangmbin:RatingBar:1.0.0'
//    implementation 'com.github.guilhe:circular-progress-view:2.0.0'
    implementation 'com.emredavarci:CircleProgressBar:1.0.8'
    implementation 'org.wysaid:gpuimage-plus:2.6.3'
    implementation 'com.github.mmin18:realtimeblurview:1.2.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    implementation 'com.romandanylyk:pageindicatorview:1.0.3'

    //fb sdk
//    implementation 'com.facebook.android:facebook-android-sdk:[4,5]'
    implementation 'com.facebook.android:audience-network-sdk:6.14.0'
    implementation 'com.facebook.android:facebook-android-sdk:16.0.0'



    // Lifecycle components
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation 'androidx.activity:activity:1.8.0'
    annotationProcessor "android.arch.lifecycle:compiler:1.1.1"

    // Room
    implementation 'androidx.room:room-ktx:2.5.2'
    annotationProcessor "androidx.room:room-compiler:2.5.2"
    kapt "androidx.room:room-compiler:2.5.2"

    //Audio tool
//    implementation ("com.github.lincollincol:AudioTool:1.2.1")
//    implementation 'com.arthenica:mobile-ffmpeg-full:4.3.1.LTS'

    //Handle Record Sound
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/TarsosDSP-1.7.jar')
}