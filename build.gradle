buildscript {
    ext.admob_version = '23.2.0'
    ext.gradle_version = '7.4.2'
    ext.googleservice_version = '4.3.15'
    ext.crash_version = '2.8.0'
    ext.kotlin_version = '1.7.0'
    ext.crash_version = '2.8.0'

    repositories {
        google()
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "com.google.gms:google-services:$googleservice_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$crash_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.43.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }
        maven { url 'https://dl.openmediation.com/omcenter/' }
        maven {
            url 'https://artifact.bytedance.com/repository/pangle'
        }
        maven {
            url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
        }
    }
}